    <!-- Customizações Específicas da Temporada (Janeiro 2026) -->
    <style>
        :root {
            --primary-color: #01f37a;
            --season-gradient: linear-gradient(180deg, rgba(7, 39, 18, 0.85) 0%, rgba(15, 36, 20, 0.9) 60%);
            --season-bg-image: url('Thumb_Abr_2026.jpg');
        }

        body.background {
            background: var(--season-gradient), var(--season-bg-image);
            background-repeat: repeat;
            background-blend-mode: multiply;
            background-size: auto, auto 100%;
            background-position: center, 0 0;
            animation: bgShift 70s linear infinite;
            color: #00f76f;
        }

        body.background::after {
            background:
                radial-gradient(circle at 20% 50%, rgba(110, 231, 150, 0.349) 0%, transparent 50%),
                radial-gradient(circle at 80% 50%, rgba(199, 240, 103, 0.15) 0%, transparent 50%);
        }

        .image-container .star:hover{
            background:rgba(114, 231, 110, 0.8);
            transform:scale(1.1);
        }

        /* ================= VIDEO MODAL - ENERO 2026 CUSTOMIZATION ================= */
        /* Barra de Progresso */
        

        .video-modal .progress-bar-container {
            background: rgba(1, 243, 41, 0.2);
            transition: background 0.2s ease;
        }

        .video-modal .progress-bar-container:hover {
            background: rgba(1, 243, 53, 0.3);
        }

        /* Botões de Controle */
        .video-modal .control-button {
            background: rgba(1, 243, 53, 0.15);
            border: 1px solid rgba(1, 243, 130, 0.4);
            color: #fff;
            transition: all 0.3s ease;
        }

        .video-modal .control-button:hover {
            background: rgba(1, 243, 33, 0.3);
            color: var(--primary-color);
            border-color: var(--primary-color);
            box-shadow: 0 0 12px rgba(1, 243, 33, 0.5);
        }

        /* Exibição de Tempo */
        .video-modal .time-display {
            color: var(--primary-color);
            text-shadow: 0 0 4px rgba(1, 243, 53, 0.6);
        }

        /* Slider de Volume */
        .video-modal .volume-slider {
            accent-color: var(--primary-color);
        }

        .video-modal .volume-slider::-webkit-slider-thumb {
            background: var(--primary-color);
            box-shadow: 0 0 6px rgba(1, 243, 53, 0.8);
        }

        .video-modal .volume-slider::-moz-range-thumb {
            background: var(--primary-color);
            box-shadow: 0 0 6px rgba(1, 243, 33, 0.8);
        }

        /* Título do Modal */
        .video-modal-title {
            text-shadow: 0 0 8px rgba(1, 243, 61, 0.5);
            background: rgba(1, 243, 53, 0.1);
            border: 1px solid rgba(1, 243, 74, 0.3);
        }
    </style>

    <script src="../../../main.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const imageContainers = document.querySelectorAll('.image-container');

            imageContainers.forEach(container => {
                const star = container.querySelector('.fa-star');
                const trigger = container.querySelector('.anime-card-trigger');
                if (!star || !trigger) return;

                const animeTitle = trigger.dataset.title;
                const storageKey = `star-${animeTitle}`;

                // Verifica o estado inicial ao carregar a página
                const starStatus = localStorage.getItem(storageKey);
                if (starStatus === 'favorited') {
                    star.classList.replace('far', 'fas');
                }

                // Adiciona o evento de clique
                star.addEventListener('click', () => {
                    if (star.classList.contains('far')) {
                        star.classList.replace('far', 'fas');
                        localStorage.setItem(storageKey, 'favorited');
                    } else {
                        star.classList.replace('fas', 'far');
                        localStorage.removeItem(storageKey);
                    }
                });
            });
        });

    </script>
